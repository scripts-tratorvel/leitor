<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leitor de etiquetas ML – Expedição</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏷️</text></svg>">
<style>
  :root{
    --bg:#f3f5f7; --card:#fff; --ink:#1b2430; --muted:#6b7684; --line:#e3e7ec;
    --accent:#ffe600; --accent-ink:#2d3277; --azul:#3483fa; --ok:#1f9d55; --erro:#d33;
    --loc:#0b5cad; --loc-bg:#e7f0fb; --sem:#a33; --sem-bg:#fbe9e9; --obs:#fff7d6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121417; --card:#1d2025; --ink:#eef1f4; --muted:#9aa4af; --line:#2e333a;
      --loc:#8cc0ff; --loc-bg:#1d3047; --sem:#ff9a9a; --sem-bg:#3a1f1f; --obs:#3a3418;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body{padding-bottom:env(safe-area-inset-bottom,0px)}
  header{position:sticky;top:0;z-index:5;background:#ffe600;color:#2d3277;
    padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:18px}
  header .sub{font-size:12px;opacity:.85;margin-top:2px}
  main{max-width:640px;margin:0 auto;padding:12px}
  .card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.12);margin-bottom:12px}
  .btn{border:0;border-radius:10px;padding:14px 12px;font-weight:700;font-size:16px;font-family:inherit;
    background:var(--azul);color:#fff;cursor:pointer;width:100%}
  .btn.sec{background:var(--line);color:var(--ink)}
  .btn[disabled]{opacity:.5}
  input{width:100%;font-size:20px;padding:10px;border:2px solid var(--line);border-radius:10px;
    text-align:center;background:var(--card);color:var(--ink);font-family:inherit}
  .linha{display:flex;gap:8px;margin-top:10px}
  .linha input{flex:1;min-width:0}
  .linha .btn{width:auto;flex:none}
  #leitor{border-radius:10px;overflow:hidden;background:#000;min-height:40px}
  #leitor video{width:100% !important;height:auto !important}
  .aviso{margin-top:8px;font-size:13px;color:var(--muted);min-height:18px}
  .res{border:3px solid var(--ok)}
  .res.erro{border-color:var(--erro)}
  .res.busca{border-color:var(--azul)}
  .cab{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .cab b{color:var(--ink);font-size:16px}
  .cli{font-size:15px;margin-top:2px}
  .item{border-top:1px solid var(--line);padding:12px 0 4px;margin-top:10px}
  .grande{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .qtd{font-weight:800;font-size:30px}
  .sku{font-family:ui-monospace,Consolas,monospace;font-weight:800;font-size:26px;overflow-wrap:anywhere}
  .desc{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
  .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .loc{display:inline-block;margin-top:6px;font-weight:800;font-size:22px;color:var(--loc);background:var(--loc-bg);border-radius:8px;padding:2px 10px}
  .loc.sem{color:var(--sem);background:var(--sem-bg)}
  .multi{background:var(--erro);color:#fff;font-weight:800;border-radius:8px;padding:8px 10px;margin-top:10px;text-align:center}
  .obs{margin-top:10px;font-size:14px;background:var(--obs);border-radius:8px;padding:6px 8px}
  .sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 4px 6px}
  .hist div{padding:10px 4px;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
  a{color:var(--azul)}
  .rodape{text-align:center;font-size:13px;margin:16px 0}
  select{width:100%;font-size:16px;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:inherit;font-weight:700}
  .btn.verde{background:var(--ok)}
  .cf{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:center}
  .cf .cont{flex:none;font-weight:800;font-size:20px;min-width:64px;text-align:center;border-radius:8px;padding:4px 6px;background:var(--line)}
  .cf.ok .cont{background:var(--ok);color:#fff}
  .cf.parcial .cont{background:#e8a400;color:#fff}
  .cf .inf{flex:1;min-width:0}
  .cf .sku{font-size:20px}
  .semean{font-size:12px;color:var(--erro);font-weight:700}
  #modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.6);padding:20px}
  #modal .caixa{background:var(--card);border-radius:14px;padding:20px;max-width:420px;width:100%;text-align:center;border:5px solid var(--erro)}
  #modal .caixa.info{border-color:var(--azul)}
  #okTela{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(31,157,85,.92);color:#fff;padding:20px;text-align:center}
  #okTela .big{font-size:64px;font-weight:900;line-height:1}
  #okTela .sku{font-size:30px;margin-top:10px}
  #okTela .desc{color:#eafff1;font-size:16px;margin-top:6px}
  #modal h2{margin:0 0 8px;font-size:22px}
  #modal p{margin:0 0 14px;font-size:16px;overflow-wrap:anywhere}
  header select{margin-top:8px;border:2px solid #2d3277;color:#2d3277;background:#fff;font-size:17px;font-weight:800}
  .botoes{display:flex;gap:8px;margin-top:12px}
  .botoes .btn{flex:1}
  .pend{border-top:1px solid var(--line);padding:10px 0}
  .pend .btn{padding:10px;font-size:14px;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>🏷️ Leitor de etiquetas ML</h1>
  <div class="sub" id="sub">Expedição Tratorvel Goiânia · v23/10b</div>
  <select id="modo" aria-label="O que você vai fazer">
    <option value="et">🏷️ Etiqueta / conferência de pedido</option>
    <option value="bl">📋 Balanço (contagem de estoque)</option>
  </select>
</header>
<main id="main"></main>
<div id="modal"><div class="caixa" id="modalCaixa"></div></div>
<div id="okTela"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
// Endereço do app de separação (planilha EXPEDIÇÃO GOIÂNIA NOVA)
var APP = 'https://script.google.com/macros/s/AKfycbz9eTBfl5cP_y4iKbbaWWhhfJz3BTm8td-F596pSKnGEZnmTfWObCky7A23IYuvFIXC/exec';

var PIN = '';
try { PIN = localStorage.getItem('leitor_pin') || ''; } catch (e) {}
var HIST = [];
try { HIST = JSON.parse(localStorage.getItem('leitor_hist') || '[]'); } catch (e) {}

var main = document.getElementById('main');
var NOMES = ['', 'Ana', 'Joel', 'Everton'];   // quem confere (mesma lista do Balanço)
var QUEM = '';
try { QUEM = localStorage.getItem('leitor_quem') || ''; } catch (e) {}
var CONF = null;          // conferência em andamento
var ULTIMO_R = null;      // último pedido lido
var leitor = null, ocupado = false, ultimo = '', ultimoEm = 0;

// Modo da página: 'et' = etiqueta/conferência, 'bl' = balanço (23/10/2026)
var MODO = 'et';
try { MODO = localStorage.getItem('leitor_modo') || 'et'; } catch (e) {}
if (/[?&]modo=bl/.test(location.search)) MODO = 'bl';
if (/[?&]modo=et/.test(location.search)) MODO = 'et';
var selModo = document.getElementById('modo');
selModo.value = MODO;
selModo.onchange = function(){
  MODO = selModo.value;
  try { localStorage.setItem('leitor_modo', MODO); } catch (e) {}
  pararCamera(); CONF = null; fecharModal();
  window.scrollTo(0,0);
  if (PIN) telaLeitor(); else telaPin();
};

function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

function api(params){
  var q = Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
  return fetch(APP + '?' + q, { method:'GET', redirect:'follow' })
    .then(function(r){ return r.text(); })
    .then(function(t){
      try { return JSON.parse(t); }
      catch(e){ throw new Error('Resposta inesperada do app (a nova versão do código foi implantada?)'); }
    });
}

/* ---------- Tela do PIN ---------- */
function telaPin(msg){
  pararCamera();
  main.innerHTML='';
  var c=el('div','card');
  c.appendChild(el('div',null,'Digite o código de acesso da expedição (o mesmo PIN do app de separação):'));
  var i=el('input'); i.type='tel'; i.inputMode='numeric'; i.autocomplete='off'; i.style.margin='12px 0';
  var b=el('button','btn','Entrar');
  var m=el('div','aviso', msg||'');
  c.appendChild(i); c.appendChild(b); c.appendChild(m);
  main.appendChild(c);
  b.onclick=function(){
    var p=i.value.trim(); if(!p) return;
    b.disabled=true; m.textContent='Conferindo…';
    api({acao:'ping', pin:p}).then(function(r){
      b.disabled=false;
      if(r.ok){ PIN=p; try{localStorage.setItem('leitor_pin',PIN);}catch(e){} telaLeitor(); }
      else m.textContent='⚠ '+(r.erro||'Código incorreto.');
    }).catch(function(e){ b.disabled=false; m.textContent='⚠ Sem conexão com o app: '+e.message; });
  };
  i.onkeydown=function(e){ if(e.key==='Enter') b.click(); };
  i.focus();
}

/* ---------- Tela do leitor ---------- */
var aviso, resBox, histBox, btnCam, inp;

function telaLeitor(){
  if(MODO==='bl'){ telaBalanco(); return; }
  main.innerHTML='';
  var c=el('div','card');
  var lt=el('div'); lt.id='leitor'; c.appendChild(lt);
  btnCam=el('button','btn','📷 Abrir câmera'); btnCam.style.marginTop='10px';
  c.appendChild(btnCam);
  var ln=el('div','linha');
  inp=el('input'); inp.type='text'; inp.inputMode='numeric'; inp.placeholder='ou digite envio, NF ou chave'; inp.autocomplete='off';
  var bb=el('button','btn','Buscar');
  ln.appendChild(inp); ln.appendChild(bb); c.appendChild(ln);
  aviso=el('div','aviso'); c.appendChild(aviso);
  main.appendChild(c);

  resBox=el('div'); main.appendChild(resBox);
  histBox=el('div','hist'); main.appendChild(histBox);
  desenharHist();

  var quem=el('div','card');
  quem.appendChild(el('div','meta','👤 Quem está conferindo (para a conferência dos itens)'));
  var sq=el('select'); sq.style.marginTop='6px';
  NOMES.forEach(function(n){ var o=el('option',null,n||'— escolha —'); o.value=n; sq.appendChild(o); });
  sq.value=NOMES.indexOf(QUEM)>=0?QUEM:'';
  sq.onchange=function(){ QUEM=sq.value; try{localStorage.setItem('leitor_quem',QUEM);}catch(e){} };
  quem.appendChild(sq); main.appendChild(quem);

  var rod=el('div','rodape');
  var a=el('a',null,'📦 Abrir o app de separação'); a.href=APP; a.target='_blank'; a.rel='noopener';
  rod.appendChild(a);
  rod.appendChild(el('br'));
  var sair=el('a',null,'Trocar código de acesso'); sair.href='#';
  sair.onclick=function(e){ e.preventDefault(); try{localStorage.removeItem('leitor_pin');}catch(_){} PIN=''; telaPin(); };
  rod.appendChild(sair);
  main.appendChild(rod);

  btnCam.onclick=function(){ if(leitor) pararCamera(); else abrirCamera(); };
  bb.onclick=function(){ var v=inp.value.trim(); if(v) buscar(v); };
  inp.onkeydown=function(e){ if(e.key==='Enter') bb.click(); };
  abrirCamera();
}

var ALVO='leitor';
function abrirCamera(alvo){
  if(leitor) return;
  ALVO=alvo||'leitor';
  if(!window.Html5Qrcode){ aviso.textContent='⚠ Não foi possível carregar o leitor. Verifique a internet e recarregue a página.'; return; }
  aviso.textContent='Abrindo a câmera…';
  var fmts=[];
  try { var F=Html5QrcodeSupportedFormats; fmts=[F.CODE_128,F.QR_CODE,F.CODE_39,F.EAN_13,F.EAN_8,F.UPC_A,F.ITF]; } catch(e){}
  try {
    leitor=new Html5Qrcode(ALVO, { formatsToSupport: fmts.length?fmts:undefined,
      experimentalFeatures:{ useBarCodeDetectorIfSupported:true }, verbose:false });
  } catch(e){
    leitor=new Html5Qrcode(ALVO);
  }
  // Câmera em alta resolução e área de leitura larga: o código do DANFE (chave de 44 números) é comprido e fino
  leitor.start({facingMode:'environment'},
    { fps:15,
      videoConstraints:{ facingMode:'environment', width:{ideal:1920}, height:{ideal:1080}, advanced:[{focusMode:'continuous'}] },
      qrbox:function(w,h){ return {width:Math.floor(w*0.96), height:Math.floor(Math.min(h*0.5, w*0.5))}; } },
    function(txt){ lido(txt); }, function(){})
  .then(function(){
    if(CONF){ return; }
    btnCam.textContent='✖ Fechar câmera'; btnCam.className='btn sec';
    if(MODO==='bl'){ aviso.textContent='Aponte para o código de barras (EAN) do produto.'; return; }
    aviso.textContent='Aponte para a etiqueta do ML ou o código de barras da nota (DANFE). No DANFE, deixe o código deitado, ocupando a largura da tela.'; })
  .catch(function(err){
    leitor=null;
    var t = (err && (err.name||'')) + ' ' + (err && err.message || err || '');
    var m='⚠ A câmera não abriu: '+t.trim()+'.';
    if(CONF){ var a=document.getElementById('confAviso'); if(a) a.textContent=m; } else aviso.textContent=m+' Toque em "Abrir câmera" e permita o acesso.';
  });
}

function pararCamera(){
  var l=leitor; leitor=null;
  if(btnCam && !CONF){ btnCam.textContent='📷 Abrir câmera'; btnCam.className='btn'; }
  if(l){ try{ l.stop().then(function(){ try{l.clear();}catch(e){} }).catch(function(){}); }catch(e){} }
}

function lido(txt){
  txt=String(txt||'').trim();
  if(CONF){ bipeConferencia(txt); return; }
  if(!txt || ocupado) return;
  if(MODO==='bl'){
    ultimo=txt; ultimoEm=Date.now();
    try{ if(navigator.vibrate) navigator.vibrate(80); }catch(e){}
    pararCamera();
    buscarBalanco(txt);
    return;
  }
  var agora=Date.now();
  if(txt===ultimo && agora-ultimoEm<8000) return;   // mesma etiqueta ainda na frente da câmera
  ultimo=txt; ultimoEm=agora;
  try{ if(navigator.vibrate) navigator.vibrate(80); }catch(e){}
  pararCamera();          // fecha a câmera assim que lê
  buscar(txt);
}

function buscar(txt){
  ocupado=true;
  resBox.innerHTML='';
  var c=el('div','card res busca','⏳ Buscando '+txt+'…'); resBox.appendChild(c);
  api({acao:'etiqueta', pin:PIN, codigo:txt}).then(function(r){
    ocupado=false;
    if(!r.ok){
      if(String(r.erro||'').indexOf('PIN')>=0){ try{localStorage.removeItem('leitor_pin');}catch(_){} telaPin('Código de acesso incorreto.'); return; }
      mostrarErro(r.erro||'Erro desconhecido.'); return;
    }
    mostrar(r.r); inp.value='';
  }).catch(function(e){ ocupado=false; mostrarErro('Sem conexão com o app: '+e.message); });
}

function botaoProxima(){
  var b=el('button','btn','📷 Ler próxima etiqueta'); b.style.marginTop='12px';
  b.onclick=function(){ resBox.innerHTML=''; window.scrollTo(0,0); abrirCamera(); };
  return b;
}

function mostrarErro(msg){
  resBox.innerHTML='';
  var c=el('div','card res erro','⚠ '+msg);
  c.appendChild(el('br')); c.appendChild(botaoProxima());
  resBox.appendChild(c);
  try{ if(navigator.vibrate) navigator.vibrate([60,60,60]); }catch(e){}
}

function mostrar(r){
  try{ if(navigator.vibrate) navigator.vibrate(150); }catch(e){}
  resBox.innerHTML='';
  var c=el('div','card res');
  var cab=el('div','cab');
  cab.appendChild(el('b',null,'NF '+(r.nf||'-')));
  cab.appendChild(el('span',null,[r.origem==='vd'?'📦 Vendas':'🛒 Mercado Livre', r.pv?'PV '+r.pv:'', r.pack?'Pack '+r.pack:''].filter(Boolean).join(' · ')));
  c.appendChild(cab);
  c.appendChild(el('div','cli',r.cliente||''));
  if(r.origem==='vd' && r.status) c.appendChild(el('div','meta','Status na planilha: '+r.status));
  var itens=r.itens||[], tot=0;
  itens.forEach(function(it){ tot+=Number(String(it.q).replace(',','.'))||1; });
  if(itens.length>1 || tot>1) c.appendChild(el('div','multi','⚠ ATENÇÃO: '+itens.length+' produto(s), '+String(tot).replace('.',',')+' peça(s) nesta etiqueta'));
  itens.forEach(function(it){
    var d=el('div','item');
    var g=el('div','grande');
    g.appendChild(el('span','qtd',it.q+'x'));
    g.appendChild(el('span','sku',it.sku||'(sem SKU)'));
    d.appendChild(g);
    d.appendChild(el('div','desc',it.desc||''));
    if(it.kit) d.appendChild(el('div','meta','🧩 parte do kit '+it.kit));
    d.appendChild(el('div','loc'+(it.local?'':' sem'),'📍 '+(it.local||'sem localização')));
    c.appendChild(d);
  });
  if(r.obs) c.appendChild(el('div','obs','📝 '+r.obs));
  ULTIMO_R=r;
  if(itens.length){
    var bc=el('button','btn verde','✅ Conferir itens (bipar produtos)'); bc.style.marginTop='12px';
    bc.onclick=function(){ iniciarConferencia(r); };
    c.appendChild(bc);
  }
  c.appendChild(botaoProxima());
  resBox.appendChild(c);

  var resumo=itens.map(function(it){ return it.q+'x '+it.sku; }).join(', ');
  var chave=r.envio||r.pv||r.nf;
  HIST=[{nf:r.nf,pv:r.pv,pack:r.pack,envio:r.envio,resumo:resumo}]
    .concat(HIST.filter(function(h){ return (h.envio||h.pv||h.nf)!==chave; })).slice(0,8);
  try{ localStorage.setItem('leitor_hist',JSON.stringify(HIST)); }catch(e){}
  desenharHist();
}

function desenharHist(){
  histBox.innerHTML='';
  if(!HIST.length) return;
  histBox.appendChild(el('div','sec','Últimas leituras'));
  HIST.forEach(function(h){
    var d=el('div',null,[h.nf?'NF '+h.nf:'', h.pv?'PV '+h.pv:''].filter(Boolean).join(' · ')+' · '+h.resumo);
    d.onclick=function(){ buscar(h.envio||h.pack||h.nf); window.scrollTo(0,0); };
    histBox.appendChild(d);
  });
}

/* ================= CONFERÊNCIA DOS ITENS ================= */
function som(ok){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    var ctx=som.ctx||(som.ctx=new C());
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.value=ok?1200:220; o.type=ok?'sine':'square';
    g.gain.value=0.2; o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+(ok?0.12:0.5));
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(ok?60:[200,100,200]); }catch(e){}
}

var MODAL_ABERTO=false;
function modal(titulo, texto, info, extra){
  var m=document.getElementById('modal'), cx=document.getElementById('modalCaixa');
  cx.className='caixa'+(info?' info':''); cx.innerHTML='';
  cx.appendChild(el('h2',null,titulo));
  if(texto) cx.appendChild(el('p',null,texto));
  if(extra) cx.appendChild(extra);
  var ok=el('button','btn','OK'); ok.style.marginTop='6px';
  ok.onclick=fecharModal; cx.appendChild(ok);
  m.style.display='flex'; MODAL_ABERTO=true;
  return ok;
}
function fecharModal(){ document.getElementById('modal').style.display='none'; MODAL_ABERTO=false; }

function erroConf(titulo, texto){
  if(CONF) CONF.erros.push(titulo+(texto?' ('+texto+')':''));
  som(false);
  modal('⛔ '+titulo, texto);
}

function iniciarConferencia(r){
  if(!QUEM){ modal('👤 Quem está conferindo?','Escolha seu nome no fim da página antes de conferir.',true); return; }
  pararCamera();
  var itens=(r.itens||[]).map(function(it){
    return { sku:String(it.sku||''), desc:it.desc||'', local:it.local||'', kit:it.kit||'',
             q:Number(String(it.q).replace(',','.'))||1, lidos:0, eans:(it.ean||[]).map(normEan), temEan:!!it.ean };
  });
  function comecar(){
    CONF={ r:r, itens:itens, erros:[], visto:{}, pausa:0 };
    desenharConf();
    abrirCamera('leitorConf');
  }
  // Os códigos de barras normalmente já vêm junto com o pedido; só consulta os que faltam
  var faltam=itens.filter(function(i){ return !i.temEan && i.sku; }).map(function(i){return i.sku;})
    .filter(function(v,i,a){ return a.indexOf(v)===i; });
  if(!faltam.length){ comecar(); return; }
  resBox.innerHTML='';
  resBox.appendChild(el('div','card res busca','⏳ Buscando os códigos de barras dos produtos…'));
  api({acao:'gtins', pin:PIN, skus:faltam.join('|')}).then(function(res){
    if(!res.ok){ mostrarErro(res.erro||'Erro ao buscar os códigos.'); return; }
    itens.forEach(function(i){ if(!i.temEan) i.eans=(res.r[i.sku]||[]).map(normEan); });
    comecar();
  }).catch(function(e){ mostrarErro('Sem conexão com o app: '+e.message); });
}

function normEan(c){ c=String(c||'').trim(); return /^\d+$/.test(c) ? c.replace(/^0+/,'') : c.toUpperCase(); }

function desenharConf(){
  var r=CONF.r;
  // A moldura (com a câmera) é criada uma vez só; depois só a lista de itens é redesenhada
  if(!CONF.lista || !document.body.contains(CONF.lista)){
    resBox.innerHTML='';
    var c=el('div','card res busca');
    var cab=el('div','cab');
    cab.appendChild(el('b',null,'🔎 Conferência · NF '+(r.nf||'-')));
    cab.appendChild(el('span',null,[r.origem==='vd'?'Vendas':'Mercado Livre', r.pv?'PV '+r.pv:''].filter(Boolean).join(' · ')));
    c.appendChild(cab);
    c.appendChild(el('div','cli',r.cliente||''));
    var lt=el('div'); lt.id='leitorConf'; lt.style.marginTop='10px'; lt.style.borderRadius='10px'; lt.style.overflow='hidden'; lt.style.background='#000';
    c.appendChild(lt);
    var bCam=el('button','btn sec','📷 Reabrir câmera'); bCam.style.marginTop='8px';
    bCam.onclick=function(){ if(!leitor) abrirCamera('leitorConf'); };
    c.appendChild(bCam);
    var av=el('div','aviso','Bipe o código de barras de cada produto.'); av.id='confAviso'; c.appendChild(av);
    var ln=el('div','linha');
    var inp=el('input'); inp.type='text'; inp.placeholder='ou digite EAN ou SKU'; inp.autocomplete='off';
    var bb=el('button','btn','OK');
    bb.onclick=function(){ var v=inp.value.trim(); if(v){ inp.value=''; bipeConferencia(v, true); } };
    inp.onkeydown=function(e){ if(e.key==='Enter') bb.click(); };
    ln.appendChild(inp); ln.appendChild(bb); c.appendChild(ln);
    CONF.lista=el('div'); c.appendChild(CONF.lista);
    resBox.appendChild(c);
  }
  var L=CONF.lista; L.innerHTML='';
  var tudo=true;
  CONF.itens.forEach(function(it){
    var st = it.lidos>=it.q ? 'ok' : (it.lidos>0 ? 'parcial' : '');
    if(it.lidos<it.q) tudo=false;
    var d=el('div','cf '+st);
    d.appendChild(el('div','cont',(it.lidos)+'/'+(it.q)));
    var inf=el('div','inf');
    inf.appendChild(el('div','sku',it.sku));
    inf.appendChild(el('div','desc',it.desc));
    if(it.q>5) inf.appendChild(el('div','meta','Mais de 5 unidades: bipe 1 e digite a quantidade'));
    if(!it.eans.length) inf.appendChild(el('div','semean','Sem EAN no Bling: digite o SKU'));
    d.appendChild(inf);
    L.appendChild(d);
  });
  var bOk=el('button','btn verde', tudo ? '✅ Concluir conferência' : 'Faltam itens para concluir');
  bOk.style.marginTop='12px'; bOk.disabled=!tudo;
  bOk.onclick=function(){ concluirConf(bOk); };
  L.appendChild(bOk);
  var bCa=el('button','btn sec','Cancelar conferência'); bCa.style.marginTop='8px';
  bCa.onclick=function(){ if(confirm('Cancelar esta conferência? Nada será registrado.')){ pararCamera(); CONF=null; mostrar(ULTIMO_R); } };
  L.appendChild(bCa);
}

function bipeConferencia(txt, digitado){
  if(!CONF || MODAL_ABERTO) return;
  var cod=normEan(txt);
  var agora=Date.now();
  if(!digitado){
    if(agora<CONF.pausa) return;                       // tela de confirmação aberta
    var visto=CONF.visto[cod]||0;
    CONF.visto[cod]=agora;
    // O mesmo código ainda na frente da câmera não conta de novo:
    // tire o produto da frente da câmera (1,5 s) para bipar a próxima unidade
    if(agora-visto<1500) return;
  }
  var cand=CONF.itens.filter(function(it){ return it.eans.indexOf(cod)>=0 || normEan(it.sku)===cod; });
  if(!cand.length){ erroConf('Produto diferente do solicitado','Código lido: '+txt+'. Esse produto não está neste pedido.'); return; }
  var it=cand.filter(function(x){ return x.lidos<x.q; })[0];
  if(!it){ erroConf('Quantidade a mais', cand[0].sku+': o pedido tem só '+cand[0].q+' unidade(s), e todas já foram conferidas.'); return; }
  if(it.q>5 && it.lidos===0){ pedirQtd(it); return; }
  it.lidos++;
  som(true);
  desenharConf();
  telaOk(it);
}

function telaOk(it){
  var t=document.getElementById('okTela');
  t.innerHTML='';
  t.appendChild(el('div','big', it.lidos>=it.q ? '✅' : '✔'));
  t.appendChild(el('div','big', it.lidos+' de '+it.q));
  t.appendChild(el('div','sku', it.sku));
  t.appendChild(el('div','desc', it.desc));
  var falta=CONF.itens.reduce(function(s,x){ return s+Math.max(0,x.q-x.lidos); },0);
  t.appendChild(el('div','desc', falta ? 'Faltam '+falta+' peça(s) no pedido' : 'Todos os itens conferidos! Toque em Concluir.'));
  t.style.display='flex';
  CONF.pausa=Date.now()+1300;
  clearTimeout(telaOk.tm);
  telaOk.tm=setTimeout(function(){ t.style.display='none'; },1300);
  t.onclick=function(){ t.style.display='none'; if(CONF) CONF.pausa=0; };
}

function pedirQtd(it){
  som(true);
  var box=el('div');
  var i=el('input'); i.type='tel'; i.inputMode='numeric'; i.placeholder='quantidade'; i.style.margin='4px 0 10px';
  box.appendChild(i);
  var ok=modal('🔢 '+it.sku, 'Quantas unidades estão na bancada? O pedido tem '+it.q+'.', true, box);
  ok.textContent='Confirmar';
  ok.onclick=function(){
    var v=Number(String(i.value).replace(',','.'));
    if(!(v>0)){ i.focus(); return; }
    fecharModal();
    if(v>it.q){ erroConf('Quantidade a mais', it.sku+': contado '+v+', o pedido tem '+it.q+'.'); return; }
    it.lidos=v;
    if(v<it.q) CONF.erros.push('Faltando '+it.sku+': contado '+v+' de '+it.q);
    desenharConf();
    telaOk(it);
  };
  setTimeout(function(){ i.focus(); },100);
}

function concluirConf(b){
  b.disabled=true; b.textContent='Registrando…';
  pararCamera();
  var r=CONF.r;
  var resumo=CONF.itens.map(function(it){ return it.lidos+'/'+it.q+' '+it.sku; }).join(', ');
  api({acao:'conferido', pin:PIN, origem:r.origem||'ml', pv:r.pv||'', nf:r.nf||'', envio:r.envio||'',
       cliente:r.cliente||'', quem:QUEM, itens:resumo, erros:CONF.erros.join(' / ')}).then(function(res){
    if(!res.ok){ b.disabled=false; b.textContent='✅ Concluir conferência'; erroConf('Não foi possível registrar', res.erro||''); return; }
    CONF=null;
    resBox.innerHTML='';
    var c=el('div','card res');
    c.appendChild(el('b',null,'✅ Conferência registrada'));
    c.appendChild(el('div','cli',[r.nf?'NF '+r.nf:'', r.pv?'PV '+r.pv:'', r.cliente||''].filter(Boolean).join(' · ')));
    if(res.r && res.r.status) c.appendChild(el('div','meta','Status na planilha: '+res.r.status));
    c.appendChild(el('div','meta','Pode embalar e etiquetar. 📦'));
    c.appendChild(botaoProxima());
    resBox.appendChild(c);
    som(true);
  }).catch(function(e){ b.disabled=false; b.textContent='✅ Concluir conferência'; erroConf('Sem conexão com o app', e.message); });
}


/* ================= BALANÇO (23/10/2026) =================
 * Mesma função da aba Balanço do app de separação, mas aqui a câmera ao vivo funciona.
 * Grava na mesma aba BALANCO da planilha. */
var balPend;

function telaBalanco(){
  main.innerHTML='';
  var q=el('div','card');
  q.appendChild(el('div','meta','👤 Quem está contando'));
  var sq=el('select'); sq.id='balQuem'; sq.style.marginTop='6px';
  NOMES.forEach(function(n){ var o=el('option',null,n||'— escolha —'); o.value=n; sq.appendChild(o); });
  sq.value=NOMES.indexOf(QUEM)>=0?QUEM:'';
  sq.onchange=function(){ QUEM=sq.value; try{localStorage.setItem('leitor_quem',QUEM);}catch(e){} if(QUEM && !leitor) abrirCamera(); };
  q.appendChild(sq); main.appendChild(q);

  var c=el('div','card');
  c.appendChild(el('div','meta','Pegue o item e leia o código de barras (EAN)'));
  var lt=el('div'); lt.id='leitor'; lt.style.marginTop='8px'; c.appendChild(lt);
  btnCam=el('button','btn','📷 Abrir câmera'); btnCam.style.marginTop='10px';
  c.appendChild(btnCam);
  var ln=el('div','linha');
  inp=el('input'); inp.type='text'; inp.placeholder='ou digite o EAN ou o SKU'; inp.autocomplete='off';
  var bb=el('button','btn','Buscar');
  ln.appendChild(inp); ln.appendChild(bb); c.appendChild(ln);
  aviso=el('div','aviso'); c.appendChild(aviso);
  main.appendChild(c);

  resBox=el('div'); main.appendChild(resBox);
  balPend=el('div'); main.appendChild(balPend);

  var rod=el('div','rodape');
  var a=el('a',null,'📦 Abrir o app de separação'); a.href=APP; a.target='_blank'; a.rel='noopener';
  rod.appendChild(a);
  rod.appendChild(el('br'));
  var sair=el('a',null,'Trocar código de acesso'); sair.href='#';
  sair.onclick=function(e){ e.preventDefault(); try{localStorage.removeItem('leitor_pin');}catch(_){} PIN=''; telaPin(); };
  rod.appendChild(sair);
  main.appendChild(rod);

  btnCam.onclick=function(){ if(leitor) pararCamera(); else if(checarQuem()) abrirCamera(); };
  bb.onclick=function(){ var v=inp.value.trim(); if(v){ pararCamera(); buscarBalanco(v); } };
  inp.onkeydown=function(e){ if(e.key==='Enter') bb.click(); };
  carregarPendentesBal();
  if(QUEM) abrirCamera(); else aviso.textContent='Escolha quem está contando para abrir a câmera.';
}

function checarQuem(){
  if(QUEM) return true;
  aviso.textContent='⚠ Escolha quem está contando antes de começar.';
  var s=document.getElementById('balQuem'); if(s) s.focus();
  return false;
}

function botaoProximoItem(){
  var b=el('button','btn','📷 Ler próximo item'); b.style.marginTop='12px';
  b.onclick=function(){ resBox.innerHTML=''; ultimo=''; window.scrollTo(0,0); if(checarQuem()) abrirCamera(); };
  return b;
}

function erroBal(msg){
  resBox.innerHTML='';
  var c=el('div','card res erro','⚠ '+msg);
  c.appendChild(el('br')); c.appendChild(botaoProximoItem());
  resBox.appendChild(c);
  try{ if(navigator.vibrate) navigator.vibrate([60,60,60]); }catch(e){}
}

function buscarBalanco(txt){
  if(!checarQuem()) return;
  ocupado=true;
  resBox.innerHTML='';
  resBox.appendChild(el('div','card res busca','⏳ Buscando '+txt+' no Bling…'));
  api({acao:'balbuscar', pin:PIN, codigo:txt}).then(function(r){
    ocupado=false;
    if(!r.ok){
      if(String(r.erro||'').indexOf('PIN')>=0){ try{localStorage.removeItem('leitor_pin');}catch(_){} telaPin('Código de acesso incorreto.'); return; }
      erroBal(r.erro||'Erro desconhecido.'); return;
    }
    inp.value='';
    mostrarBalanco(r.r);
  }).catch(function(e){ ocupado=false; erroBal('Sem conexão com o app: '+e.message); });
}

function mostrarBalanco(p){
  try{ if(navigator.vibrate) navigator.vibrate(120); }catch(e){}
  resBox.innerHTML='';
  var c=el('div','card res busca');
  var cab=el('div','cab');
  cab.appendChild(el('b',null,p.sku||'(sem SKU)'));
  cab.appendChild(el('span',null,p.gtin?'EAN '+p.gtin:''));
  c.appendChild(cab);
  c.appendChild(el('div','desc',p.nome||''));
  c.appendChild(el('div','loc'+(p.local?'':' sem'),'📍 Sistema: '+(p.local||'sem localização')));
  var g=el('div','grande'); g.style.marginTop='10px';
  g.appendChild(el('span','qtd',String(p.fisico)));
  g.appendChild(el('span',null,'no estoque do sistema'));
  c.appendChild(g);
  if(p.reservado>0) c.appendChild(el('div','meta','(inclui '+p.reservado+' reservado(s) para pedidos ainda sem nota)'));
  if(p.depositos>1) c.appendChild(el('div','meta','Saldo distribuído em '+p.depositos+' depósitos no Bling'));
  if(p.ultima) c.appendChild(el('div','meta','ℹ Já contado em '+p.ultima));

  var bs=el('div','botoes');
  var ok=el('button','btn verde','✅ Confere ('+p.fisico+')');
  var dif=el('button','btn sec','✏️ Alterar');
  bs.appendChild(ok); bs.appendChild(dif); c.appendChild(bs);
  var area=el('div'); c.appendChild(area);
  ok.onclick=function(){ salvarBal(p,p.fisico,'',c); };
  dif.onclick=function(){
    area.innerHTML='';
    var f=el('div'); f.style.marginTop='12px';
    f.appendChild(el('div','meta','🔢 Quantidade contada'));
    var iq=el('input'); iq.type='tel'; iq.inputMode='decimal'; iq.value=String(p.fisico); iq.style.marginTop='4px';
    f.appendChild(iq);
    f.appendChild(el('div','meta','📍 Localização correta'));
    var il=el('input'); il.type='text'; il.value=p.local||''; il.placeholder='ex.: PA 07 C'; il.style.textTransform='uppercase'; il.style.marginTop='4px';
    f.appendChild(il);
    var sv=el('button','btn','💾 Salvar alteração'); sv.style.marginTop='12px';
    f.appendChild(sv);
    area.appendChild(f);
    iq.focus(); iq.select();
    sv.onclick=function(){
      var v=iq.value.trim().replace(',','.');
      if(v==='' || isNaN(Number(v))){ iq.focus(); return; }
      var nl=il.value.trim().toUpperCase();
      var mudouLocal = nl && nl.replace(/\s/g,'')!==(p.local||'').replace(/\s/g,'').toUpperCase();
      salvarBal(p, Number(v), mudouLocal?nl:'', c);
    };
  };
  resBox.appendChild(c);
}

function salvarBal(p, contado, novoLocal, card){
  Array.prototype.forEach.call(card.querySelectorAll('button'),function(b){ b.disabled=true; });
  var dados={id:p.id, sku:p.sku, nome:p.nome, gtin:p.gtin, local:p.local, fisico:p.fisico,
             contado:contado, novoLocal:novoLocal, prateleira:'', quem:QUEM};
  api({acao:'balregistrar', pin:PIN, dados:JSON.stringify(dados)}).then(function(res){
    if(!res.ok){
      Array.prototype.forEach.call(card.querySelectorAll('button'),function(b){ b.disabled=false; });
      modal('⛔ Não foi possível salvar', res.erro||''); return;
    }
    var r=res.r;
    resBox.innerHTML='';
    var d=el('div','card res'+(r.situacao==='OK'?'':' erro'));
    d.appendChild(el('b',null,(r.situacao==='OK'?'✅ Conferido: ':'📝 Alteração registrada: ')+p.sku));
    if(contado!==p.fisico) d.appendChild(el('div','meta','🔢 Quantidade: sistema '+p.fisico+' → contado '+contado+' (diferença '+(contado-p.fisico>0?'+':'')+(contado-p.fisico)+')'));
    if(novoLocal) d.appendChild(el('div','meta','📍 Localização: '+(p.local||'sem')+' → '+novoLocal));
    if(r.situacao!=='OK') d.appendChild(el('div','meta','Foi para a lista de pendentes de ajuste.'));
    if(r.hoje) d.appendChild(el('div','meta','Hoje: '+r.hoje.ok+' conferido(s) · '+r.hoje.pend+' divergência(s)'));
    d.appendChild(botaoProximoItem());
    resBox.appendChild(d);
    try{ if(navigator.vibrate) navigator.vibrate(150); }catch(e){}
    carregarPendentesBal();
  }).catch(function(e){
    Array.prototype.forEach.call(card.querySelectorAll('button'),function(b){ b.disabled=false; });
    modal('⛔ Sem conexão com o app', e.message);
  });
}

function carregarPendentesBal(){
  if(!balPend) return;
  api({acao:'balpendentes', pin:PIN}).then(function(res){
    if(!res.ok || !document.body.contains(balPend)) return;
    var lista=res.r||[];
    balPend.innerHTML='';
    balPend.appendChild(el('div','sec','⏳ Pendentes de ajuste no Bling ('+lista.length+')'));
    var c=el('div','card');
    if(!lista.length){ c.appendChild(el('div','meta','Nenhuma divergência pendente.')); balPend.appendChild(c); return; }
    lista.forEach(function(it, k){
      var d=el('div','pend'); if(k===0) d.style.borderTop='0';
      var g=el('div','grande');
      var s=el('span','sku',it.sku); s.style.fontSize='18px'; g.appendChild(s);
      g.appendChild(el('span','meta','📍 '+(it.local||'-')));
      d.appendChild(g);
      d.appendChild(el('div','desc',it.nome));
      var dfs=it.contado-it.fisico;
      if(dfs!==0) d.appendChild(el('div',null,'🔢 Quantidade: sistema '+it.fisico+' → contado '+it.contado+'  ('+(dfs>0?'+':'')+dfs+')'));
      if(it.novoLocal) d.appendChild(el('div',null,'📍 Localização: '+(it.local||'sem')+' → '+it.novoLocal));
      d.appendChild(el('div','meta',it.quando+' · '+it.quem));
      var b=el('button','btn','✔ Já ajustei no Bling');
      b.onclick=function(){
        b.disabled=true;
        api({acao:'balajustado', pin:PIN, linha:it.linha}).then(function(r){
          if(!r.ok){ b.disabled=false; modal('⛔ Não foi possível marcar', r.erro||''); return; }
          carregarPendentesBal();
        }).catch(function(e){ b.disabled=false; modal('⛔ Sem conexão com o app', e.message); });
      };
      d.appendChild(b);
      c.appendChild(d);
    });
    balPend.appendChild(c);
  }).catch(function(){});
}

document.addEventListener('visibilitychange', function(){ if(document.hidden) pararCamera(); });

if(PIN) telaLeitor(); else telaPin();
