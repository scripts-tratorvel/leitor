<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leitor de etiquetas ML – Expedição</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏷️</text></svg>">
<style>
  :root{
    --bg:#f3f5f7; --card:#fff; --ink:#1b2430; --muted:#6b7684; --line:#e3e7ec;
    --accent:#ffe600; --accent-ink:#2d3277; --azul:#3483fa; --ok:#1f9d55; --erro:#d33;
    --loc:#0b5cad; --loc-bg:#e7f0fb; --sem:#a33; --sem-bg:#fbe9e9; --obs:#fff7d6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121417; --card:#1d2025; --ink:#eef1f4; --muted:#9aa4af; --line:#2e333a;
      --loc:#8cc0ff; --loc-bg:#1d3047; --sem:#ff9a9a; --sem-bg:#3a1f1f; --obs:#3a3418;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body{padding-bottom:env(safe-area-inset-bottom,0px)}
  header{position:sticky;top:0;z-index:5;background:#ffe600;color:#2d3277;
    padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:18px}
  header .sub{font-size:12px;opacity:.85;margin-top:2px}
  main{max-width:640px;margin:0 auto;padding:12px}
  .card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.12);margin-bottom:12px}
  .btn{border:0;border-radius:10px;padding:14px 12px;font-weight:700;font-size:16px;font-family:inherit;
    background:var(--azul);color:#fff;cursor:pointer;width:100%}
  .btn.sec{background:var(--line);color:var(--ink)}
  .btn[disabled]{opacity:.5}
  input{width:100%;font-size:20px;padding:10px;border:2px solid var(--line);border-radius:10px;
    text-align:center;background:var(--card);color:var(--ink);font-family:inherit}
  .linha{display:flex;gap:8px;margin-top:10px}
  .linha input{flex:1;min-width:0}
  .linha .btn{width:auto;flex:none}
  #leitor{border-radius:10px;overflow:hidden;background:#000;min-height:40px}
  #leitor video{width:100% !important;height:auto !important}
  .aviso{margin-top:8px;font-size:13px;color:var(--muted);min-height:18px}
  .res{border:3px solid var(--ok)}
  .res.erro{border-color:var(--erro)}
  .res.busca{border-color:var(--azul)}
  .cab{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .cab b{color:var(--ink);font-size:16px}
  .cli{font-size:15px;margin-top:2px}
  .item{border-top:1px solid var(--line);padding:12px 0 4px;margin-top:10px}
  .grande{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .qtd{font-weight:800;font-size:30px}
  .sku{font-family:ui-monospace,Consolas,monospace;font-weight:800;font-size:26px;overflow-wrap:anywhere}
  .desc{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
  .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .loc{display:inline-block;margin-top:6px;font-weight:800;font-size:22px;color:var(--loc);background:var(--loc-bg);border-radius:8px;padding:2px 10px}
  .loc.sem{color:var(--sem);background:var(--sem-bg)}
  .multi{background:var(--erro);color:#fff;font-weight:800;border-radius:8px;padding:8px 10px;margin-top:10px;text-align:center}
  .obs{margin-top:10px;font-size:14px;background:var(--obs);border-radius:8px;padding:6px 8px}
  .sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 4px 6px}
  .hist div{padding:10px 4px;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
  a{color:var(--azul)}
  .rodape{text-align:center;font-size:13px;margin:16px 0}
</style>
</head>
<body>
<header>
  <h1>🏷️ Leitor de etiquetas ML</h1>
  <div class="sub" id="sub">Expedição Tratorvel Goiânia</div>
</header>
<main id="main"></main>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
// Endereço do app de separação (planilha EXPEDIÇÃO GOIÂNIA NOVA)
var APP = 'https://script.google.com/macros/s/AKfycbz9eTBfl5cP_y4iKbbaWWhhfJz3BTm8td-F596pSKnGEZnmTfWObCky7A23IYuvFIXC/exec';

var PIN = '';
try { PIN = localStorage.getItem('leitor_pin') || ''; } catch (e) {}
var HIST = [];
try { HIST = JSON.parse(localStorage.getItem('leitor_hist') || '[]'); } catch (e) {}

var main = document.getElementById('main');
var leitor = null, ocupado = false, ultimo = '', ultimoEm = 0;

function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

function api(params){
  var q = Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
  return fetch(APP + '?' + q, { method:'GET', redirect:'follow' })
    .then(function(r){ return r.text(); })
    .then(function(t){
      try { return JSON.parse(t); }
      catch(e){ throw new Error('Resposta inesperada do app (a nova versão do código foi implantada?)'); }
    });
}

/* ---------- Tela do PIN ---------- */
function telaPin(msg){
  pararCamera();
  main.innerHTML='';
  var c=el('div','card');
  c.appendChild(el('div',null,'Digite o código de acesso da expedição (o mesmo PIN do app de separação):'));
  var i=el('input'); i.type='tel'; i.inputMode='numeric'; i.autocomplete='off'; i.style.margin='12px 0';
  var b=el('button','btn','Entrar');
  var m=el('div','aviso', msg||'');
  c.appendChild(i); c.appendChild(b); c.appendChild(m);
  main.appendChild(c);
  b.onclick=function(){
    var p=i.value.trim(); if(!p) return;
    b.disabled=true; m.textContent='Conferindo…';
    api({acao:'ping', pin:p}).then(function(r){
      b.disabled=false;
      if(r.ok){ PIN=p; try{localStorage.setItem('leitor_pin',PIN);}catch(e){} telaLeitor(); }
      else m.textContent='⚠ '+(r.erro||'Código incorreto.');
    }).catch(function(e){ b.disabled=false; m.textContent='⚠ Sem conexão com o app: '+e.message; });
  };
  i.onkeydown=function(e){ if(e.key==='Enter') b.click(); };
  i.focus();
}

/* ---------- Tela do leitor ---------- */
var aviso, resBox, histBox, btnCam, inp;

function telaLeitor(){
  main.innerHTML='';
  var c=el('div','card');
  var lt=el('div'); lt.id='leitor'; c.appendChild(lt);
  btnCam=el('button','btn','📷 Abrir câmera'); btnCam.style.marginTop='10px';
  c.appendChild(btnCam);
  var ln=el('div','linha');
  inp=el('input'); inp.type='text'; inp.inputMode='numeric'; inp.placeholder='ou digite nº envio / NF'; inp.autocomplete='off';
  var bb=el('button','btn','Buscar');
  ln.appendChild(inp); ln.appendChild(bb); c.appendChild(ln);
  aviso=el('div','aviso'); c.appendChild(aviso);
  main.appendChild(c);

  resBox=el('div'); main.appendChild(resBox);
  histBox=el('div','hist'); main.appendChild(histBox);
  desenharHist();

  var rod=el('div','rodape');
  var a=el('a',null,'📦 Abrir o app de separação'); a.href=APP; a.target='_blank'; a.rel='noopener';
  rod.appendChild(a);
  rod.appendChild(el('br'));
  var sair=el('a',null,'Trocar código de acesso'); sair.href='#';
  sair.onclick=function(e){ e.preventDefault(); try{localStorage.removeItem('leitor_pin');}catch(_){} PIN=''; telaPin(); };
  rod.appendChild(sair);
  main.appendChild(rod);

  btnCam.onclick=function(){ if(leitor) pararCamera(); else abrirCamera(); };
  bb.onclick=function(){ var v=inp.value.trim(); if(v) buscar(v); };
  inp.onkeydown=function(e){ if(e.key==='Enter') bb.click(); };
  abrirCamera();
}

function abrirCamera(){
  if(leitor) return;
  if(!window.Html5Qrcode){ aviso.textContent='⚠ Não foi possível carregar o leitor. Verifique a internet e recarregue a página.'; return; }
  aviso.textContent='Abrindo a câmera…';
  var fmts=[];
  try { var F=Html5QrcodeSupportedFormats; fmts=[F.CODE_128,F.QR_CODE,F.CODE_39,F.EAN_13,F.ITF]; } catch(e){}
  try {
    leitor=new Html5Qrcode('leitor', { formatsToSupport: fmts.length?fmts:undefined,
      experimentalFeatures:{ useBarCodeDetectorIfSupported:true }, verbose:false });
  } catch(e){
    leitor=new Html5Qrcode('leitor');
  }
  leitor.start({facingMode:'environment'},
    { fps:12, qrbox:function(w,h){ var lw=Math.min(w*0.9,420); return {width:lw, height:Math.min(h*0.6, lw*0.6)}; } },
    function(txt){ lido(txt); }, function(){})
  .then(function(){ btnCam.textContent='✖ Fechar câmera'; btnCam.className='btn sec'; aviso.textContent='Aponte para o código de barras ou o QR Code da etiqueta.'; })
  .catch(function(err){
    leitor=null;
    var t = (err && (err.name||'')) + ' ' + (err && err.message || err || '');
    aviso.textContent='⚠ A câmera não abriu: '+t.trim()+'. Toque em "Abrir câmera" e permita o acesso.';
  });
}

function pararCamera(){
  var l=leitor; leitor=null;
  if(btnCam){ btnCam.textContent='📷 Abrir câmera'; btnCam.className='btn'; }
  if(l){ try{ l.stop().then(function(){ try{l.clear();}catch(e){} }).catch(function(){}); }catch(e){} }
}

function lido(txt){
  txt=String(txt||'').trim();
  if(!txt || ocupado) return;
  var agora=Date.now();
  if(txt===ultimo && agora-ultimoEm<8000) return;   // mesma etiqueta ainda na frente da câmera
  ultimo=txt; ultimoEm=agora;
  try{ if(navigator.vibrate) navigator.vibrate(80); }catch(e){}
  pararCamera();          // fecha a câmera assim que lê
  buscar(txt);
}

function buscar(txt){
  ocupado=true;
  resBox.innerHTML='';
  var c=el('div','card res busca','⏳ Buscando '+txt+'…'); resBox.appendChild(c);
  api({acao:'etiqueta', pin:PIN, codigo:txt}).then(function(r){
    ocupado=false;
    if(!r.ok){
      if(String(r.erro||'').indexOf('PIN')>=0){ try{localStorage.removeItem('leitor_pin');}catch(_){} telaPin('Código de acesso incorreto.'); return; }
      mostrarErro(r.erro||'Erro desconhecido.'); return;
    }
    mostrar(r.r); inp.value='';
  }).catch(function(e){ ocupado=false; mostrarErro('Sem conexão com o app: '+e.message); });
}

function botaoProxima(){
  var b=el('button','btn','📷 Ler próxima etiqueta'); b.style.marginTop='12px';
  b.onclick=function(){ resBox.innerHTML=''; window.scrollTo(0,0); abrirCamera(); };
  return b;
}

function mostrarErro(msg){
  resBox.innerHTML='';
  var c=el('div','card res erro','⚠ '+msg);
  c.appendChild(el('br')); c.appendChild(botaoProxima());
  resBox.appendChild(c);
  try{ if(navigator.vibrate) navigator.vibrate([60,60,60]); }catch(e){}
}

function mostrar(r){
  try{ if(navigator.vibrate) navigator.vibrate(150); }catch(e){}
  resBox.innerHTML='';
  var c=el('div','card res');
  var cab=el('div','cab');
  cab.appendChild(el('b',null,'NF '+(r.nf||'-')));
  cab.appendChild(el('span',null,[r.pv?'PV '+r.pv:'', r.pack?'Pack '+r.pack:''].filter(Boolean).join(' · ')));
  c.appendChild(cab);
  c.appendChild(el('div','cli',r.cliente||''));
  var itens=r.itens||[], tot=0;
  itens.forEach(function(it){ tot+=Number(String(it.q).replace(',','.'))||1; });
  if(itens.length>1 || tot>1) c.appendChild(el('div','multi','⚠ ATENÇÃO: '+itens.length+' produto(s), '+String(tot).replace('.',',')+' peça(s) nesta etiqueta'));
  itens.forEach(function(it){
    var d=el('div','item');
    var g=el('div','grande');
    g.appendChild(el('span','qtd',it.q+'x'));
    g.appendChild(el('span','sku',it.sku||'(sem SKU)'));
    d.appendChild(g);
    d.appendChild(el('div','desc',it.desc||''));
    if(it.kit) d.appendChild(el('div','meta','🧩 parte do kit '+it.kit));
    d.appendChild(el('div','loc'+(it.local?'':' sem'),'📍 '+(it.local||'sem localização')));
    c.appendChild(d);
  });
  if(r.obs) c.appendChild(el('div','obs','📝 '+r.obs));
  c.appendChild(botaoProxima());
  resBox.appendChild(c);

  var resumo=itens.map(function(it){ return it.q+'x '+it.sku; }).join(', ');
  var chave=r.envio||r.pv||r.nf;
  HIST=[{nf:r.nf,pv:r.pv,pack:r.pack,envio:r.envio,resumo:resumo}]
    .concat(HIST.filter(function(h){ return (h.envio||h.pv||h.nf)!==chave; })).slice(0,8);
  try{ localStorage.setItem('leitor_hist',JSON.stringify(HIST)); }catch(e){}
  desenharHist();
}

function desenharHist(){
  histBox.innerHTML='';
  if(!HIST.length) return;
  histBox.appendChild(el('div','sec','Últimas leituras'));
  HIST.forEach(function(h){
    var d=el('div',null,[h.nf?'NF '+h.nf:'', h.pv?'PV '+h.pv:''].filter(Boolean).join(' · ')+' · '+h.resumo);
    d.onclick=function(){ buscar(h.envio||h.pack||h.nf); window.scrollTo(0,0); };
    histBox.appendChild(d);
  });
}

document.addEventListener('visibilitychange', function(){ if(document.hidden) pararCamera(); });

if(PIN) telaLeitor(); else telaPin();
</script>
</body>
</html>
